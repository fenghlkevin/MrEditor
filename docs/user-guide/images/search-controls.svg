<text x="48" y="132" font-size="21" fill="#253d59">1. 范围：当前文件 / 选中文本 / 所有已打开文件</text>
<rect x="30" y="160" width="1040" height="53" rx="9" fill="white" stroke="#cedced"/>
<text x="48" y="194" font-size="21" fill="#253d59">2. 查找词 · Aa 大小写 · .* 正则 · 下一处 / 上一处</text>
